name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The release notes are the matching CHANGELOG section, so the notes and
      # the shipped CHANGELOG.md can never disagree.
      - name: Extract release notes
        shell: powershell
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $lines = [IO.File]::ReadAllLines('CHANGELOG.md', [Text.Encoding]::UTF8)
          $body = New-Object System.Collections.Generic.List[string]
          $capture = $false
          foreach ($line in $lines) {
            if ($line -match '^##\s') {
              if ($capture) { break }
              if ($line -match ('^##\s+' + [regex]::Escape($version) + '(\s|$)')) { $capture = $true }
              continue
            }
            if ($capture) { $body.Add($line) }
          }
          $text = ($body -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($text)) { $text = 'See CHANGELOG.md for details.' }
          [IO.File]::WriteAllText('release-notes.md', $text, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "Release notes for $version : $($text.Length) characters"

      - shell: powershell
        run: ./scripts/build-release.ps1

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: artifacts/TerrariaSeedRoller-win-x64.zip
